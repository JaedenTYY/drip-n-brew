name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Using Node 20 as standard for modern Nuxt 3 apps
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint (Optional)
        run: |
          # If you have a typecheck or lint script, you can uncomment these
          # npm run typecheck
          # npm run lint
        continue-on-error: true

      - name: Build Application
        run: npm run build
        env:
          # Add any environment variables required during build here
          NODE_ENV: production
